[project]
name = "goalvla"
version = "0.1.0"
description = "GoalVLA: Goal-Conditioned Visual Language Action via World Model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0,<2.4",
    "torchvision>=0.16.0,<0.19",
    "numpy<2",
    "pillow",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "opencv-python>=4.8.0",
    "viser",
    "tqdm",
    "pycocotools>=2.0.6",
    "google-genai",
    "timm",
    "ftfy",
    "hydra-core>=1.3",
    "transformers>=4.40,<5",
    "supervision>=0.16.0",
    "addict",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=62.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goalvla*"]
